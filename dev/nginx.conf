# Static server for the run contract. Serves only what the page needs, read-only; no state, nothing written.
# Everything else (docs/, tests/, scripts/, compose.yaml, ...) is 404 even though the repo root is mounted.
server {
  listen 80;
  root /usr/share/nginx/html;
  add_header Cache-Control "no-store" always;
  location ~ /\. { deny all; }
  location = / { try_files /eric-board.html =404; }
  location = /eric-board.html { }
  location = /seed.json { }
  location = /dev/claude-stub.js { }
  location /app/ { try_files $uri =404; }
  location /brand/ { try_files $uri =404; }
  location /images/ { try_files $uri =404; }
  location /data/ { try_files $uri =404; }
  location / { return 404; }
}
